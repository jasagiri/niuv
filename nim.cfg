--mm:orc
# No --path for src/: modules import each other relatively, and tests import
# "../../src/niuv/<module>". A bare src/ on the path would let a file named
# like a standard module (macros, utils) shadow it.
# nim-cbor-det: the deterministic CBOR of the manifest.
--path:"$config/../nim-cbor-det/src"
# nim-frames: the frame loop of the child form.
--path:"$config/../nim-frames/src"
