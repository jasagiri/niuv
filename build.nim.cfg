# Build configuration for niuv
# This file centralizes all build output directories

# Main build directory structure (similar to Cargo)
--outdir:"build/bin"
--nimcache:"build/nimcache"

# For tests
--out:"build/tests/$projectName"

# Platform-specific settings
when defined(release):
  --opt:speed
  --passC:"-flto"
  --passL:"-flto"
else:
  --debugger:native
  --stackTrace:on
  --lineTrace:on