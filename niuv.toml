# niuv.toml - Generated from .nimble file
# Nim Virtual Environment Project Configuration

[project]
author = "jasagiri"
license = "Apache-2.0"
version = "0.1.0"
description = "Nim Virtual Environment Manager and Nimble Replacement"
name = "niuv"

[dependencies]
egison-patterns = ">= 1.0.0"
nim-design-patterns = ">= 0.1.0"
nim-testkit = ">= 0.1.0"
nim = ">= 2.0.0"
parsetoml = ">= 0.7.2"

[tasks]
scaffold = "Scaffold a new module or project"
docs = "niuv doc --project --format=html"
coverage = "niuv coverage --format=html,lcov,json"
checkScripts = "Check if all required scripts exist"
featureOne = "Run a specific feature test"
testOne = "Run a specific test"
install = "niuv install --user"
help = "Show available tasks"
clean = "niuv clean --all"
build = "niuv compile --optimize --output=build/"
test = "niuv test --coverage --parallel"
buildTest = "Build a test without running it"
featureReport = "Generate feature test reports"

[testing]
parallel_execution = true
mece_organization = true
coverage_threshold = 95.0
output_format = ["html", "json", "lcov"]
framework = "nim-testkit"

[build]
memory_management = "arc"
safety_checks = "true"
optimization = "speed"
backend = "c"
debug_info = "true"

[coverage]
types = ["line", "branch", "function"]
format = ["html", "lcov", "json"]
threshold = 95.0
output_dir = ".coverage"
enabled = true

[paths]
tests = "tests"
docs = "docs"
bin = "build/bin"
src = "src"
build = "build"

[quality]
security_scan_enabled = true
documentation_coverage_minimum = 90.0
performance_regression_threshold = 5.0
code_coverage_minimum = 95.0

