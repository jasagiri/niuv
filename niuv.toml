# niuv builds itself: `niuv build niuv` in a workspace that lists this
# directory, nim-cbor-det and nim-frames (see AGENTS.md).
[package]
name = "niuv"
version = "0.2.0"
license = "Apache-2.0"

[nim]
src = "src"
flags = ["--mm:orc"]

[[nim.bin]]
name = "niuv"
main = "src/niuv.nim"
flags = ["-d:release", "--hints:off"]

[dependencies]
workspace = ["nim-cbor-det", "nim-frames"]

[dependencies.external.parsetoml]
source = "github.com/NimParsers/parsetoml.git"
version = "0.7.2"
src = "src"
license = "MIT"

[dependencies.external.results]
source = "github.com/arnetheduck/nim-results"
version = "0.5.1"
license = "MIT"

[dependencies.external.checksums]
source = "github.com/nim-lang/checksums"
version = "0.2.1"
src = "src"
license = "MIT"
